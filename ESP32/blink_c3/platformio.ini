; ESP32-C3 Super Mini — blink + serial over native USB-CDC
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; C3 Super Mini uses the chip's native USB (no UART bridge).
; These flags route Serial over USB-CDC so the monitor works.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
