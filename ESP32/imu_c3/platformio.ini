; ESP32-C3 Super Mini — ADXL345 800Hz FIFO streamer over native USB-CDC
; ADXL345 wiring: VCC->3V3  GND->GND  SDA->GPIO0  SCL->GPIO1
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 460800
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; C3 Super Mini uses the chip's native USB (no UART bridge) for Serial.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
